[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemini-book-to-skill"
version = "1.4.0"
description = "Convert books and documents into structured, on-demand Google Antigravity and Gemini agent skills."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
book-to-skill = "book_to_skill.cli:main"

[project.optional-dependencies]
html = ["trafilatura"]
epub = ["ebooklib", "beautifulsoup4"]
pdf = ["pdf-inspector>=1.15,<2", "pypdf", "pdfminer.six"]
docx = ["python-docx"]
rtf = ["striprtf"]
technical = ["docling"]
all = [
    "trafilatura",
    "ebooklib",
    "beautifulsoup4",
    "pdf-inspector>=1.15,<2",
    "pypdf",
    "pdfminer.six",
    "python-docx",
    "striprtf",
    "docling"
]

[tool.hatch.build.targets.wheel]
packages = ["book_to_skill"]
